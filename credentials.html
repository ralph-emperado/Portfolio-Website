<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentials | Ralph Emperado</title>
<meta name="description" content="Certifications and completed courses behind Ralph Emperado's work in automation, CRM, ads, and web design.">
<link rel="icon" href="assets/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .certs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cert{display:flex;flex-direction:column;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}
  .cert:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateY(-2px);box-shadow:0 18px 50px rgba(var(--accent-rgb),.2)}
  .cert .img{display:block;width:100%;aspect-ratio:4/3;padding:0;border:0;border-bottom:1px solid var(--line);background:#f7f8fa;cursor:zoom-in;overflow:hidden}
  .cert .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .cert:hover .img img{transform:scale(1.03)}
  .cert .m{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
  .issuer{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:10px;font-weight:700;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .issuer img{width:14px;height:14px;border-radius:3px;background:#fff;padding:1px}
  .cert h2{font-size:15px;font-weight:800;line-height:1.35;margin:10px 0 8px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--faint)}
  .meta b{color:var(--muted);font-weight:600}
  .verify{margin-top:auto;padding-top:14px;font-size:12px;font-weight:700;color:var(--cta)}
  .verify:hover{text-decoration:underline}
  /* full-size viewer */
  .lb{position:fixed;inset:0;z-index:90;background:rgba(4,3,8,.9);backdrop-filter:blur(6px);display:none;place-items:center;padding:24px;cursor:zoom-out}
  .lb.show{display:grid}
  .lb img{max-width:min(1100px,100%);max-height:86vh;border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .lb button{position:fixed;top:18px;right:20px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(8,6,14,.85);color:#fff;font-size:22px;cursor:pointer}
  @media (max-width:1000px){.certs{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.certs{grid-template-columns:1fr}}
</style>
</head>
<body data-page="credentials">
<main class="page">
  <header class="head">
    <p class="kicker rise">Credentials &amp; Certifications</p>
    <h1 class="title rise d1">Always learning,<br><span class="y">always building.</span></h1>
    <p class="sub rise d2">The courses and certifications behind my work, from ad strategy to automation. Each one links back to the issuer so you can verify it.</p>
  </header>
  <div class="certs" id="certs"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Certificate"><button type="button" aria-label="Close">×</button><img alt=""></div>

<script src="assets/js/site.js"></script>
<script>
  // Certificates: {title, issuer:[name, domain for logo], img, date, length, verify}
  const certs=[
    {title:'Facebook Ads & Facebook Marketing MASTERY 2024',issuer:['Udemy','udemy.com'],
     img:'assets/img/certs/udemy-facebook-ads-mastery-2024.jpg',date:'Sept 10, 2024',length:'12.5 hours',
     verify:'https://ude.my/UC-6797df01-bd96-499b-9f36-c63704eac356'}
  ];
  document.getElementById('certs').innerHTML=certs.map((c,k)=>`
    <article class="panel cert rise" style="animation-delay:${.15+k*.05}s">
      <button class="img" type="button" data-full="${c.img}" aria-label="View ${c.title} certificate full size"><img src="${c.img}" alt="${c.title} certificate" loading="lazy"></button>
      <div class="m">
        <span class="issuer"><img src="https://www.google.com/s2/favicons?domain=${c.issuer[1]}&sz=64" alt="">${c.issuer[0]}</span>
        <h2>${c.title}</h2>
        <div class="meta"><span>Completed <b>${c.date}</b></span><span>Length <b>${c.length}</b></span></div>
        <a class="verify" href="${c.verify}" target="_blank" rel="noopener">Verify certificate ↗</a>
      </div>
    </article>`).join('');

  const lb=document.getElementById('lb'),lbImg=lb.querySelector('img');
  document.getElementById('certs').addEventListener('click',e=>{const b=e.target.closest('.img');if(!b)return;lbImg.src=b.dataset.full;lbImg.alt=b.querySelector('img').alt;lb.classList.add('show')});
  lb.addEventListener('click',()=>lb.classList.remove('show'));
  addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('show')});
</script>
</body>
</html>
