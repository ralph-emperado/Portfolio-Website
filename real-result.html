<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Result | Ralph Emperado</title>
<meta name="description" content="Live websites designed and built by Ralph Emperado in WordPress and GoHighLevel.">
<link rel="icon" href="assets/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .filters button{cursor:pointer;transition:.2s}
  .filters button:hover{border-color:rgba(255,255,255,.3)}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .empty{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--faint);font-size:14px;border:1px dashed var(--line);border-radius:18px}
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .shot{overflow:hidden;transition:.25s}
  .shot:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateY(-2px)}
  .shot div.m{padding:12px 16px 14px}
  .shot b{display:block;font-size:13px;font-weight:700}
  .shot small{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace}
  /* website cards: live screenshot, name, link, short summary */
  .shot.real{cursor:pointer;color:inherit}
  .shot .thumb{display:block;aspect-ratio:16/10;overflow:hidden;background:#fff;border-bottom:1px solid var(--line)}
  .shot .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
  .shot.real:hover .thumb img{transform:scale(1.04)}
  .shot .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .shot .wp{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 8px 3px 4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);white-space:nowrap}
  .shot .desc{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:8px}
  .shot .wp img{width:14px;height:14px;border-radius:3px;background:#fff;padding:1px}
  @media (max-width:1000px){.shots{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.shots{grid-template-columns:1fr}}
</style>
</head>
<body data-page="results">
<main class="page">
  <header class="head">
    <p class="kicker rise">Web Design</p>
    <h1 class="title rise d1">Real websites,<br><span class="y">for real businesses.</span></h1>
    <p class="sub rise d2">Live websites I've designed and built in WordPress and GoHighLevel, each made to explain the business clearly and turn visitors into enquiries. Click any site to see it live.</p>
  </header>
  <div class="filters rise d2" id="filters" role="group" aria-label="Filter results"></div>
  <div class="shots" id="shots"></div>
</main>
<script src="assets/js/site.js"></script>
<script>
  // Websites. href opens the site; shot (optional) is the page to screenshot if it differs from href.
  // Screenshots are live snapshots via WordPress mShots.
  const shotOf=url=>'https://s.wordpress.com/mshots/v1/'+encodeURIComponent(url)+'?w=1280';
  const WP=['WordPress','wordpress.org'], GHL=['GoHighLevel','gohighlevel.com'];
  // Full websites
  const sites=[
    {t:'Co-Lab VA',u:'colabva.online',href:'https://colabva.online/',tool:WP,
      d:'A website for a virtual assistant agency that places trained VAs with Australian businesses. It explains their services and steers visitors toward booking a free consultation.'},
    {t:'Chris Kidd',u:'chris-kidd.com',href:'https://chris-kidd.com/',tool:WP,
      d:'A personal brand website for a business owner and entrepreneur. It introduces Chris, his ventures and track record, and gives people a clear way to work with him.'},
    {t:'Contessa Finlay',u:'contessaoffical.com.au',href:'https://contessaoffical.com.au/',tool:WP,
      d:'A founder website for a Western Australian entrepreneur. It brings her ventures across multiple industries together in one place, with routes for partnership and business enquiries.'},
    // Domain transfer in progress: links to the GoHighLevel preview for now.
    // Once interactwellcare.com points to the new design, change href to 'https://interactwellcare.com/' and remove shot.
    {t:'Interact Well Care',u:'interactwellcare.com',href:'https://sites.leadconnectorhq.com/preview/Aayao3PilTcjVvPpy3v8?notrack=true',tool:GHL,
      d:'A website for a physician-led brain health and dementia care education service. It speaks to families, caregivers, and care organizations, with clear paths into its programs and resources.'}
  ];
  // Individual page designs: {t, u, href, tool, d} (same fields as sites)
  const pages=[
    {t:'BECNT · Startups',u:'becnt.com.au/startups',href:'https://becnt.com.au/startups',tool:GHL,
      d:'A service page for people turning a business idea into a launch. It meets first-time founders where they are and walks them through clear, practical first steps.'},
    {t:'BECNT · Early-Stage',u:'becnt.com.au/early-stage',href:'https://becnt.com.au/early-stage',tool:GHL,
      d:'A page for young Northern Territory businesses in their busiest, most chaotic phase. It names the common pain points and shows how support helps owners prioritise and grow.'},
    {t:'BECNT · Growth',u:'becnt.com.au/growth',href:'https://becnt.com.au/growth',tool:GHL,
      d:'A page for established owners stuck firefighting. It speaks to the overwhelm of running a growing business and positions support around clarity, control, and leading again.'},
    {t:'BECNT · Next Chapter',u:'becnt.com.au/becnt-next-chapter',href:'https://becnt.com.au/becnt-next-chapter',tool:GHL,
      d:'A page for Territory business owners planning their exit or succession. It offers calm, respectful guidance on protecting what they have built and preparing for what comes next.'},
    {t:'BECNT · Regional Business Clinics',u:'becnt.com.au/regional-business-clinics',href:'https://becnt.com.au/regional-business-clinics-873873',tool:GHL,
      d:'A register-interest page for free one-on-one business clinics in four regional NT towns. Owners pick their town and what they need help with, and get notified when dates are set.'}
  ];

  const card=(i,k)=>
    `<a class="panel shot real rise" style="animation-delay:${k*.05}s" href="${i.href}" target="_blank" rel="noopener" aria-label="${i.t}: open website in a new tab"><span class="thumb"><img src="${shotOf(i.shot||i.href)}" alt="${i.t} screenshot" loading="lazy"></span><div class="m"><div class="row"><b>${i.t}</b><span class="wp"><img src="https://www.google.com/s2/favicons?domain=${i.tool[1]}&sz=64" alt="">${i.tool[0]}</span></div><small>${i.u} ↗</small><p class="desc">${i.d}</p></div></a>`;
  const groups={All:[...sites,...pages],Websites:sites,Pages:pages};
  const S=document.getElementById('shots'),F=document.getElementById('filters');
  function show(name){
    const list=groups[name];
    S.innerHTML=list.length?list.map(card).join(''):'<p class="empty">Page designs are coming soon.</p>';
    F.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===name));
  }
  F.innerHTML=Object.keys(groups).map(n=>'<button class="chip" type="button" data-f="'+n+'">'+n+'</button>').join('');
  F.onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.f)};
  show('All');
</script>
</body>
</html>
